version: "3.8"

services:
  db:
    image: postgres:15
    container_name: rorschach-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: rorschach_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Montamos el script init.sql para que se ejecute automáticamente al crear la BD
      - ./src/database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
